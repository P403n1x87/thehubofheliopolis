name: Build and Deploy
on:
  push:
    branches: [master]
  pull_request:

# Deploys from master queue up rather than overlap; a new push to a pull
# request cancels the checks still running for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install 📦
        run: |
          pip install poetry
          poetry update

      - name: Test 🧪
        run: poetry run pytest

      - name: Build 🔧
        run: poetry run invoke preview

      # Pull requests are only tested and built; only master is published.
      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          branch: gh-pages
          folder: output
          repository-name: P403n1x87/P403n1x87.github.io
          token: ${{ secrets.GH_PAGES_TOKEN }}
          clean: false
