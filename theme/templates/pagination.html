{% if DEFAULT_PAGINATION %}
<nav class="pager" aria-label="Pagination">
  <span>{% if articles_page.has_next() %}-- More --{% else %}(END){% endif %} ({{ articles_page.number }}/{{ articles_paginator.num_pages }})</span>
  {% if articles_page.has_previous() %}
  <a rel="prev" href="{{ SITEURL }}/{{ articles_previous_page.url }}">[p]rev</a>
  {% endif %}
  {% if articles_page.has_next() %}
  <a rel="next" href="{{ SITEURL }}/{{ articles_next_page.url }}">[n]ext</a>
  {% endif %}
</nav>
{% endif %}
