{% extends "base.html" %}

{% block title %}{{ SITENAME }} - Authors{% endblock %}

{% block cwd %}<a href="{{ SITEURL }}/">~</a>/authors{% endblock %}

{% block content %}
<p class="cmd"><span class="ps1">$</span> ls -l authors/</p>
<ul class="ls-l">
{% for author, articles in authors|sort %}
  <li><span class="count">{{ articles|count }}</span> <a href="{{ SITEURL }}/{{ author.url }}">{{ author }}/</a></li>
{% endfor %}
</ul>
{% endblock %}
