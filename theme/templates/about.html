{% extends "page.html" %}

{% block aside %}
<img class="avatar"
     src="https://avatars3.githubusercontent.com/u/20231758?s=400&u=bf4a8570d64ab38e3795e6bd7fad4dca7da8113c&v=4"
     alt="{{ AUTHOR }}" width="200" height="200" />
<p class="cmd"><span class="ps1">$</span> ls -l ~/links</p>
<ul class="links">
{% for name, link in SOCIAL %}
  <li><a href="{{ link }}" rel="me noopener" target="_blank"><span class="link-name">{{ name }}</span> -&gt; <span class="link-target">{{ link|replace('https://', '')|replace('www.', '') }}</span></a></li>
{% endfor %}
</ul>
{% endblock %}
